name: Word Puck CI and WeChat Build

on:
  push:
    branches:
      - feature/puck-battle-prototype
    paths:
      - "games/puck-battle/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/GITHUB_AUTOMATION.md"
  pull_request:
    branches:
      - main
    paths:
      - "games/puck-battle/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/GITHUB_AUTOMATION.md"
  workflow_dispatch:

concurrency:
  group: word-puck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic-validation:
    name: Logic tests and project validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Cocos project structure
        run: node scripts/validate-project.mjs
      - name: Run logic unit tests
        run: npx --yes tsx@4.20.6 --tsconfig tsconfig.logic.json --test tests/logic/*.test.ts

  cocos-wechat-build:
    name: Cocos Creator 3.8.8 WeChat build
    needs: logic-validation
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/puck-battle-prototype') }}
    runs-on: [self-hosted, Windows, X64, cocos-creator]
    timeout-minutes: 30
    steps:
      - name: Restore source from GitHub archive
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/zipball/$($env:GITHUB_SHA)"
          $archive = Join-Path $env:RUNNER_TEMP 'word-puck-source.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'word-puck-source'
          $headers = @{
            Authorization = "Bearer $($env:GH_TOKEN)"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $retrieved = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -Headers $headers -OutFile $archive -UseBasicParsing -TimeoutSec 60
              if ((Get-Item -LiteralPath $archive).Length -lt 1024) {
                throw 'GitHub returned an unexpectedly small archive.'
              }
              $retrieved = $true
              break
            } catch {
              Write-Warning "Archive download attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 5) { Start-Sleep -Seconds (5 * $attempt) }
            }
          }
          if (-not $retrieved) { throw 'Unable to restore the source from GitHub archive.' }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $sourceDir = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          if (-not $sourceDir) { throw 'GitHub archive has no project root folder.' }
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $sourceDir.FullName -Force |
            Copy-Item -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          $projectFile = Join-Path $env:GITHUB_WORKSPACE 'games\puck-battle\package.json'
          if (-not (Test-Path -LiteralPath $projectFile -PathType Leaf)) {
            throw 'GitHub API archive checkout is incomplete.'
          }
          Write-Host "GitHub archive restored for commit $env:GITHUB_SHA"
      - name: Build WeChat Mini Game with Cocos Creator
        shell: powershell
        env:
          COCOS_CREATOR_PATH: ${{ vars.COCOS_CREATOR_PATH }}
          WECHAT_APP_ID: ${{ vars.WECHAT_APP_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'games\puck-battle'
          $buildScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\windows\build-wechat.ps1'
          & $buildScript -CreatorPath $env:COCOS_CREATOR_PATH -ProjectPath $projectPath
      - name: Upload ready-to-play WeChat package
        id: game-upload
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: word-puck-ready-to-play
          path: games/puck-battle/build/ci-wechatgame/
          if-no-files-found: error
          retention-days: 14
      - name: Retry game package upload if needed
        if: success() && steps.game-upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: word-puck-ready-to-play-retry
          path: games/puck-battle/build/ci-wechatgame/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics separately
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: word-puck-build-logs
          path: |
            ${{ runner.temp }}\cocos-build.log
            ${{ runner.temp }}\cocos-build.stdout.log
            ${{ runner.temp }}\cocos-build.stderr.log
            ${{ runner.temp }}\cocos-creator-cli.log
          if-no-files-found: ignore
          retention-days: 14
